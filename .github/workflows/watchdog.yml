name: Very Good Films watchdog
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
  issues: write
concurrency:
  group: very-good-films-watchdog
  cancel-in-progress: true
jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check health and confirmed media IDs
        id: health
        env:
          VGF_HEALTH_STRICT: '1'
        run: npm run health
      - name: Check for active publisher recovery
        if: failure()
        id: publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          active="$(gh run list --workflow publisher.yml --limit 20 --json status --jq 'map(select(.status == "in_progress" or .status == "queued")) | length')"
          if [ "$active" -gt 0 ]; then
            echo 'active=true' >> "$GITHUB_OUTPUT"
            echo 'A publisher run is already active; recovery dispatch is unnecessary.'
          else
            echo 'active=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Check whether publisher has recoverable work
        if: failure()
        id: work
        run: |
          node --input-type=module -e "import fs from 'node:fs';const m=JSON.parse(fs.readFileSync('state/memory.json'));fs.appendFileSync(process.env.GITHUB_OUTPUT,'available='+m.items.some(x=>['ready','partial','publishing','discovered'].includes(x.status))+'\n');"
      - name: Dispatch publisher recovery
        if: failure() && steps.publisher.outputs.active != 'true' && steps.work.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publisher.yml --ref main
      - name: Open or update incident issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --state open --search "in:title publisher watchdog" --json number --jq '.[0].number' | {
            read number || true
            if [ -n "$number" ]; then gh issue comment "$number" --body "Watchdog still failing at $GITHUB_RUN_ID"; else gh issue create --title "publisher watchdog: no confirmed post" --body "The five-minute watchdog detected a stalled or unhealthy publisher. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; fi
          }
