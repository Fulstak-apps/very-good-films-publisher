name: Very Good Films pipeline
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to publish
        required: false
        default: all
      queue_item:
        description: Optional queue item key
        required: false
      retry_mode:
        description: Retry behavior
        required: false
        default: normal
      dry_run:
        description: Prepare and validate without publishing
        required: false
        type: boolean
        default: false
      maximum_posts:
        description: Maximum posts for this run
        required: false
        default: '1'
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths-ignore: ['state/**', 'docs/**', '*.md']
permissions:
  contents: write
concurrency:
  group: very-good-films-publisher
  cancel-in-progress: false
jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Configure durable state
        run: |
          git config user.name 'Very Good Films'
          git config user.email 'actions@users.noreply.github.com'
      - name: Test publisher
        run: npm test
      - name: Install formatter
        run: command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
      - name: Discover, prepare, and publish
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          VGF_MEDIA_ORIGIN: ${{ vars.VGF_MEDIA_ORIGIN }}
          VGF_UPLOAD_TOKEN: ${{ secrets.VGF_UPLOAD_TOKEN }}
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          VGF_DURABLE_GIT: '1'
          VGF_PLATFORM: ${{ inputs.platform || 'all' }}
          VGF_MAX_POSTS: ${{ inputs.maximum_posts || '1' }}
        run: |
          npm run publish
          npm run cycle
          for attempt in 1 2 3; do
            node --input-type=module -e "import fs from 'node:fs';const m=JSON.parse(fs.readFileSync('state/memory.json'));process.exit(m.items.some(x=>x.status==='publishing')?0:1)" || break
            sleep 60
            npm run publish
          done
      - name: Preserve state on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-${{ github.run_id }}
          path: state/memory.json
          retention-days: 30
      - name: Upload failure bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-${{ github.run_id }}
          path: |
            state/memory.json
            health-report.json
            logs/**
          if-no-files-found: ignore
          retention-days: 30
      - name: Health report
        if: always()
        run: npm run health
      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-${{ github.run_id }}
          path: health-report.json
          retention-days: 14
